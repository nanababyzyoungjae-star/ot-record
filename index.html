<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nana's OT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #d9d9d9;
    }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: #4f5357;
      overflow-x: hidden;
      background: transparent;
    }

    /* ภาพพื้นหลังขาวดำ */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image: url("nanas-ot-bg.jpg");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      filter: grayscale(100%) contrast(0.92) brightness(1.05);
    }

    /* ชั้นสีขาวบาง ๆ */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(255, 255, 255, 0.14);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      margin: auto;
      padding: 18px 14px 45px;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1,
    header p {
      display: none;
    }

    .ot-banner {
      display: block;
      width: 100%;
      max-width: 760px;
      height: auto;
      margin: 0 auto;
      border-radius: 20px;
      box-shadow: 0 10px 28px rgba(50, 50, 50, 0.16);
    }

    /* กล่องกระจก */
    .card {
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(60, 60, 60, 0.12);
    }

    .card h2 {
      margin-top: 0;
      font-size: 19px;
      color: #555a5f;
      font-weight: 700;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #5c6064;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid rgba(130, 130, 130, 0.28);
      border-radius: 11px;
      font-size: 15px;
      outline: none;
      color: #4f5357;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(100, 105, 110, 0.55);
      box-shadow: 0 0 0 3px rgba(120, 120, 120, 0.10);
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary {
      background: rgba(105, 110, 115, 0.90);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 5px 14px rgba(60, 60, 60, 0.12);
    }

    .btn-primary:hover {
      background: rgba(80, 85, 90, 0.95);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.65);
      color: #5e6368;
      border: 1px solid rgba(120, 120, 120, 0.22);
    }

    .btn-danger {
      background: rgba(245, 245, 245, 0.72);
      color: #777b7f;
      border: 1px solid rgba(120, 120, 120, 0.20);
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .summary-box {
      background: rgba(255, 255, 255, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
    }

    .summary-box .number {
      font-size: 27px;
      font-weight: 700;
      color: #60656a;
    }

    .summary-box .label {
      margin-top: 4px;
      color: #777c80;
      font-size: 13px;
    }

    .period {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .period strong {
      color: #62676b;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(100, 100, 100, 0.13);
      text-align: left;
      font-size: 14px;
      color: #555a5e;
    }

    th {
      background: rgba(255, 255, 255, 0.58);
      color: #64696d;
    }

    td.hours {
      font-weight: 700;
      color: #62676c;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #85898d;
    }

    #syncStatus {
      margin-top: 10px;
      font-size: 13px;
      color: #777c80;
    }

    .footer {
      text-align: center;
      color: rgba(80, 80, 80, 0.72);
      font-size: 12px;
      margin-top: 25px;
    }

    @media (max-width: 650px) {
      .container {
        padding: 12px 10px 35px;
      }

      .ot-banner {
        border-radius: 16px;
        margin-bottom: 12px;
      }

      .card {
        padding: 14px;
        border-radius: 17px;
      }

      .card h2 {
        font-size: 17px;
      }

      .form-grid {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .full {
        grid-column: 1 / -1;
      }

      input,
      textarea,
      select {
        font-size: 14px;
        padding: 9px 10px;
      }

      label {
        font-size: 13px;
        margin-bottom: 4px;
      }

      button {
        font-size: 13px;
        padding: 9px 12px;
      }

      .summary {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 7px;
      }

      .summary-box {
        padding: 11px 5px;
      }

      .summary-box .number {
        font-size: 22px;
      }

      .summary-box .label {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <img
        src="nanas-ot-banner-final.png"
        alt="Nana's OT"
        class="ot-banner"
      />
    </header>

    <!-- ฟอร์มบันทึก -->
    <div class="card">
      <h2>📝 บันทึก OT</h2>

      <form id="otForm">
        <input type="hidden" id="editId">

        <div class="form-grid">

          <div>
            <label for="date">วันที่</label>
            <input type="date" id="date" required>
          </div>

          <div>
            <label for="type">ประเภท</label>
            <select id="type">
              <option value="OT">OT</option>
              <option value="WFH">WFH</option>
              <option value="อื่น ๆ">อื่น ๆ</option>
            </select>
          </div>

          <div>
            <label for="start">เวลาเริ่ม</label>
            <input type="time" id="start" required>
          </div>

          <div>
            <label for="end">เวลาสิ้นสุด</label>
            <input type="time" id="end" required>
          </div>

          <div class="full">
            <label for="note">หมายเหตุ</label>
            <textarea
              id="note"
              placeholder="เช่น ปิดงานประจำเดือน / งานด่วน / Support ลูกค้า"
            ></textarea>
          </div>

        </div>

        <div class="buttons">
          <button type="submit" class="btn-primary" id="saveBtn">
            + บันทึก OT
          </button>

          <button
            type="button"
            class="btn-secondary"
            id="cancelBtn"
            style="display:none;"
          >
            ยกเลิกแก้ไข
          </button>
        </div>

        <div id="syncStatus">
          ☁️ ข้อมูลจะถูกส่งไป Google Sheets เมื่อกดบันทึก
        </div>
      </form>
    </div>

    <!-- สรุป -->
    <div class="card">
      <div class="period">
        <h2 style="margin:0;">📊 สรุป OT</h2>
        <strong id="periodText"></strong>
      </div>

      <div class="summary">

        <div class="summary-box">
          <div class="number" id="totalDays">0</div>
          <div class="label">จำนวนวันที่ทำ OT</div>
        </div>

        <div class="summary-box">
          <div class="number" id="totalHours">0</div>
          <div class="label">ชั่วโมง OT รวม</div>
        </div>

        <div class="summary-box">
          <div class="number" id="totalRecords">0</div>
          <div class="label">รายการทั้งหมดในรอบ</div>
        </div>

      </div>
    </div>

    <!-- รายการ -->
    <div class="card">
      <div class="period">

        <h2 style="margin:0;">📋 รายการที่บันทึกแล้ว</h2>

        <button class="btn-danger" onclick="clearAll()">
          ล้างข้อมูลทั้งหมด
        </button>

      </div>

      <div class="table-wrapper">
        <table>

          <thead>
            <tr>
              <th>วันที่</th>
              <th>ประเภท</th>
              <th>เริ่ม</th>
              <th>สิ้นสุด</th>
              <th>ชั่วโมง</th>
              <th>หมายเหตุ</th>
              <th>จัดการ</th>
            </tr>
          </thead>

          <tbody id="otTable"></tbody>

        </table>
      </div>
    </div>

    <div class="footer">
      Nana's OT • ข้อมูลถูกบันทึกในเครื่องและ Google Sheets
    </div>

  </div>

<script>
  const form = document.getElementById("otForm");
  const dateInput = document.getElementById("date");
  const startInput = document.getElementById("start");
  const endInput = document.getElementById("end");
  const typeInput = document.getElementById("type");
  const noteInput = document.getElementById("note");
  const editIdInput = document.getElementById("editId");
  const table = document.getElementById("otTable");
  const saveBtn = document.getElementById("saveBtn");
  const cancelBtn = document.getElementById("cancelBtn");

  // Google Apps Script Web App
  const GOOGLE_SHEETS_API =
    "https://script.google.com/macros/s/AKfycbzzopOmcphO3E4GkmH9TSk8jSyXCB3brYTvEf1FU8dY8MVlgSQIhCSiuSJMCBJiIFI/exec";

  let records = [];

  async function loadRecordsFromGoogleSheets() {
    try {
      const response = await fetch(GOOGLE_SHEETS_API);
      const result = await response.json();

      if (result.success && Array.isArray(result.records)) {
        records = result.records.map((item, index) => ({
          id: "sheet-" + index,
          date: normalizeDate(item.date),
          type: "OT",
          start: item.start || "",
          end: item.end || "",
          hours: Number(item.hours) || 0,
          note: item.note || ""
        }));

        render();
      }
    } catch (error) {
      console.error(
        "โหลดข้อมูลจาก Google Sheets ไม่สำเร็จ:",
        error
      );
    }
  }

  function normalizeDate(value) {
    const date = new Date(value);

    if (isNaN(date.getTime())) {
      return String(value).substring(0, 10);
    }

    return date.toISOString().split("T")[0];
  }

  // ตั้งวันที่วันนี้เป็นค่าเริ่มต้น
  dateInput.value = new Date().toISOString().split("T")[0];

  function calculateHours(start, end) {
    const [sh, sm] = start.split(":").map(Number);
    const [eh, em] = end.split(":").map(Number);

    let startMinutes = sh * 60 + sm;
    let endMinutes = eh * 60 + em;

    // รองรับ OT ข้ามเที่ยงคืน
    if (endMinutes < startMinutes) {
      endMinutes += 24 * 60;
    }

    return (endMinutes - startMinutes) / 60;
  }

  function getCurrentPeriod() {
    const today = new Date();

    let year = today.getFullYear();
    let month = today.getMonth();

    // วันที่ 1-15 = รอบเริ่มวันที่ 16 ของเดือนก่อน
    if (today.getDate() <= 15) {
      month--;

      if (month < 0) {
        month = 11;
        year--;
      }
    }

    const start = new Date(year, month, 16);

    let endMonth = month + 1;
    let endYear = year;

    if (endMonth > 11) {
      endMonth = 0;
      endYear++;
    }

    const end = new Date(endYear, endMonth, 15);

    return {
      start,
      end
    };
  }

  function formatDate(dateString) {
    const date = new Date(dateString + "T00:00:00");

    return date.toLocaleDateString("th-TH", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    });
  }

  function getPeriodText() {
    const {
      start,
      end
    } = getCurrentPeriod();

    return `${start.toLocaleDateString("th-TH")} - ${end.toLocaleDateString("th-TH")}`;
  }

  function isInCurrentPeriod(dateString) {
    const {
      start,
      end
    } = getCurrentPeriod();

    const date = new Date(dateString + "T00:00:00");

    return date >= start && date <= end;
  }

  function saveRecords() {
    localStorage.setItem(
      "nanasOT",
      JSON.stringify(records)
    );
  }

  // ส่งข้อมูลไป Google Sheets
  async function sendToGoogleSheets(data) {
    try {
      const payload = new URLSearchParams();

      payload.append(
        "payload",
        JSON.stringify(data)
      );

      await fetch(GOOGLE_SHEETS_API, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"
        },
        body: payload.toString()
      });

      return true;

    } catch (error) {
      console.error(
        "ส่งข้อมูลไป Google Sheets ไม่สำเร็จ:",
        error
      );

      return false;
    }
  }

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    if (
      !dateInput.value ||
      !startInput.value ||
      !endInput.value
    ) {
      alert("กรุณากรอกวันที่และเวลาให้ครบค่ะ");
      return;
    }

    const hours = calculateHours(
      startInput.value,
      endInput.value
    );

    if (hours <= 0) {
      alert(
        "เวลาสิ้นสุดต้องไม่เท่ากับเวลาเริ่มค่ะ"
      );
      return;
    }

    const editId = editIdInput.value;

    const data = {
      id: editId || Date.now().toString(),
      date: dateInput.value,
      type: typeInput.value,
      start: startInput.value,
      end: endInput.value,
      hours: hours,
      note: noteInput.value.trim()
    };

    if (editId) {
      records = records.map(item =>
        item.id === editId ? data : item
      );
    } else {
      records.push(data);
    }

    // เก็บข้อมูลในเครื่อง
    saveRecords();
    render();

    const syncStatus =
      document.getElementById("syncStatus");

    if (syncStatus) {
      syncStatus.textContent =
        "☁️ กำลังส่งข้อมูลไป Google Sheets...";
    }

    resetForm();

    sendToGoogleSheets(data).then(ok => {

      if (syncStatus) {
        syncStatus.textContent = ok
          ? "☁️ ส่งข้อมูลไป Google Sheets แล้ว • ข้อมูลสำรองอยู่ในเครื่องนี้"
          : "⚠️ บันทึกในเครื่องแล้ว แต่ส่ง Google Sheets ไม่สำเร็จ";
      }

      // โหลดข้อมูลจาก Google Sheets หลังส่งสำเร็จ
      if (ok) {
        setTimeout(
          loadRecordsFromGoogleSheets,
          800
        );
      }
    });
  });

  function editRecord(id) {
    const item = records.find(
      r => r.id === id
    );

    if (!item) return;

    editIdInput.value = item.id;
    dateInput.value = item.date;
    typeInput.value = item.type;
    startInput.value = item.start;
    endInput.value = item.end;
    noteInput.value = item.note;

    saveBtn.textContent =
      "💾 บันทึกการแก้ไข";

    cancelBtn.style.display =
      "inline-block";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  function deleteRecord(id) {
    if (
      !confirm(
        "ต้องการลบรายการนี้ใช่ไหมคะ?"
      )
    ) {
      return;
    }

    records = records.filter(
      r => r.id !== id
    );

    saveRecords();
    render();
  }

  function clearAll() {
    if (!records.length) {
      alert("ยังไม่มีข้อมูลให้ล้างค่ะ");
      return;
    }

    if (
      !confirm(
        "ต้องการลบข้อมูล OT ทั้งหมดหรือไม่?"
      )
    ) {
      return;
    }

    records = [];

    saveRecords();
    render();
  }

  function resetForm() {
    editIdInput.value = "";

    dateInput.value =
      new Date().toISOString().split("T")[0];

    typeInput.value = "OT";
    startInput.value = "";
    endInput.value = "";
    noteInput.value = "";

    saveBtn.textContent =
      "+ บันทึก OT";

    cancelBtn.style.display =
      "none";
  }

  cancelBtn.addEventListener(
    "click",
    resetForm
  );

  function render() {
    document.getElementById(
      "periodText"
    ).textContent =
      "รอบ " + getPeriodText();

    const currentRecords = records
      .filter(item =>
        isInCurrentPeriod(item.date)
      )
      .sort((a, b) =>
        b.date.localeCompare(a.date)
      );

    const totalHours =
      currentRecords.reduce(
        (sum, item) =>
          sum + Number(item.hours),
        0
      );

    const uniqueDays =
      new Set(
        currentRecords.map(
          item => item.date
        )
      ).size;

    document.getElementById(
      "totalDays"
    ).textContent = uniqueDays;

    document.getElementById(
      "totalHours"
    ).textContent =
      formatHours(totalHours);

    document.getElementById(
      "totalRecords"
    ).textContent =
      currentRecords.length;

    if (!currentRecords.length) {

      table.innerHTML = `
        <tr>
          <td colspan="7" class="empty">
            ยังไม่มีรายการ OT ในรอบนี้ 🌷
          </td>
        </tr>
      `;

      return;
    }

    table.innerHTML =
      currentRecords.map(item => `

      <tr>

        <td>
          ${formatDate(item.date)}
        </td>

        <td>
          ${escapeHTML(item.type)}
        </td>

        <td>
          ${formatTime(item.start)}
        </td>

        <td>
          ${formatTime(item.end)}
        </td>

        <td class="hours">
          ${formatHours(item.hours)} ชม.
        </td>

        <td>
          ${escapeHTML(item.note || "-")}
        </td>

        <td>

          <button
            class="btn-secondary"
            onclick="editRecord('${item.id}')">
            แก้ไข
          </button>

          <button
            class="btn-danger"
            onclick="deleteRecord('${item.id}')">
            ลบ
          </button>

        </td>

      </tr>

    `).join("");
  }

  function formatTime(value) {
    if (!value) return "";

    const text =
      String(value).trim();

    // เช่น 18:00
    const timeOnly =
      text.match(
        /^(\d{1,2}):(\d{2})/
      );

    if (timeOnly) {
      return `${
        timeOnly[1].padStart(2, "0")
      }:${
        timeOnly[2]
      }`;
    }

    // วันที่พร้อมเวลา
    const date =
      new Date(text);

    if (!isNaN(date.getTime())) {

      return date.toLocaleTimeString(
        "th-TH",
        {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone: "Asia/Bangkok"
        }
      );
    }

    return text;
  }

  function formatHours(hours) {
    const h =
      Math.floor(hours);

    const m =
      Math.round(
        (hours - h) * 60
      );

    if (m === 0) {
      return h;
    }

    return `${h}.${String(
      Math.round(m / 6)
    ).padStart(1, "0")}`;
  }

  function escapeHTML(value) {
    return String(value)
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );
  }

  // โหลดข้อมูลจาก Google Sheets
  loadRecordsFromGoogleSheets();
</script>

</body>
</html>
